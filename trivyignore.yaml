# Trivy findings reviewed and accepted, each with the reason. Everything else fails the build.
misconfigurations:
  - id: DS-0031
    paths: ["services/api-gateway/Dockerfile"]
    statement: >-
      False positive. AUTH_UPSTREAM and RATE_*_AUTH contain a host:port and rate-limit numbers,
      not secrets. Trivy flags them only because the names contain "AUTH".
  - id: KSV-0109
    paths: ["monitoring/manifests/dashboard.yaml"]
    statement: >-
      False positive. The ConfigMap holds a Grafana dashboard definition (panel titles and
      PromQL queries); it contains no credentials.
  - id: AWS-0104
    paths: ["infra/terraform/main.tf", "main.tf"]   # matches both the repo-root scan and the infra-only scan
    statement: >-
      Accepted risk. The k3s server must reach the internet on many hosts and ports to pull container
      images, Helm charts, OS packages and Let's Encrypt certificates. Inbound access is what is
      restricted: only 80/443 are public, and SSH/Kubernetes API are limited to the admin's IP.
