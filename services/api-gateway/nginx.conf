# Main NGINX config, tuned for the registration rush.
# The default allows 1024 connections per worker; a rush needs far more, because every
# request also holds an upstream connection. Site config lives in conf.d (from the template).
worker_processes auto;
worker_rlimit_nofile 32768;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    # Writable paths under /tmp, so the container root filesystem can stay read-only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;
    tcp_nopush   on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
