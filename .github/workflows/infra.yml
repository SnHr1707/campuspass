# Checks the Terraform code whenever it changes: formatting, validity and security misconfigurations.
name: Infrastructure

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: infra/terraform }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: "1.13.4" }
      - name: Formatting
        run: terraform fmt -check -recursive -diff
      - name: Validate (no cloud credentials needed)
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: ${{ github.workspace }}/trivyignore.yaml   # reviewed exceptions, each with a reason
        with:
          version: v0.69.3
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
