# Dependabot opens a pull request each week when a dependency, base image or action has an update.
# Each PR runs the full pipeline, so updates are tested before they merge.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/services/auth-service", "/services/booking-service", "/services/frontend"]
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: maven
    directory: /services/event-service
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: pip
    directory: /services/ticket-service
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directories:
      - /services/auth-service
      - /services/booking-service
      - /services/event-service
      - /services/ticket-service
      - /services/api-gateway
      - /services/frontend
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule: { interval: weekly }
