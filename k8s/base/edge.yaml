# The edge of the system: the NGINX API gateway, the React frontend and the Ingress.

# ------------------------------------------------------------------ api-gateway
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels: { app: api-gateway }
spec:
  selector: { app: api-gateway }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels: { app: api-gateway, tier: edge }
spec:
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway, tier: edge }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101      # "nginx" user in nginx-unprivileged
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api-gateway
          image: campuspass/api-gateway
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          # NGINX renders its config into conf.d at start-up, so these paths must be writable.
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: confd, mountPath: /etc/nginx/conf.d }
            - { name: cache, mountPath: /var/cache/nginx }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: confd, emptyDir: {} }
        - { name: cache, emptyDir: {} }
---
# ------------------------------------------------------------------ frontend
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: { app: frontend }
spec:
  selector: { app: frontend }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: frontend, tier: edge }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend, tier: edge }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: campuspass/frontend
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 96Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: confd, mountPath: /etc/nginx/conf.d }
            - { name: cache, mountPath: /var/cache/nginx }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: confd, emptyDir: {} }
        - { name: cache, emptyDir: {} }
---
# ------------------------------------------------------------------ Ingress
# Only entry point from outside. "/" goes to the React app, "/api" to the gateway.
# The host name, TLS and ingress class are set per environment in the overlays.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campuspass
spec:
  rules:
    - host: campuspass.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { name: http } }
