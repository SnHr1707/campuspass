# Production on the AWS EC2 k3s server. Argo CD deploys this folder from the "gitops" branch;
# the CI pipeline updates the image tags below on that branch after every successful build.
#
# Before the first deploy, set YOUR domain in ingress-patch.yaml (two places).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - cluster-issuer.yaml
images:
  - {name: campuspass/auth-service, newName: ghcr.io/snhr1707/campuspass-auth-service, newTag: sha-b98289e}
  - {name: campuspass/event-service, newName: ghcr.io/snhr1707/campuspass-event-service, newTag: sha-b98289e}
  - {name: campuspass/booking-service, newName: ghcr.io/snhr1707/campuspass-booking-service, newTag: sha-b98289e}
  - {name: campuspass/ticket-service, newName: ghcr.io/snhr1707/campuspass-ticket-service, newTag: sha-b98289e}
  - {name: campuspass/api-gateway, newName: ghcr.io/snhr1707/campuspass-api-gateway, newTag: sha-b98289e}
  - {name: campuspass/frontend, newName: ghcr.io/snhr1707/campuspass-frontend, newTag: sha-b98289e}
patches:
  - path: ingress-patch.yaml
    target: {kind: Ingress, name: campuspass}
