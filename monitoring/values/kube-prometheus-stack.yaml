# Helm values for kube-prometheus-stack (Prometheus + Grafana + kube-state-metrics + node-exporter).
# Installed by cloud-init; the domain and admin password are passed with --set.

# k3s runs these components inside one process, so there is nothing separate to scrape.
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }

alertmanager:
  enabled: false   # alerts still show in Prometheus and Grafana; no email/Slack routing needed

prometheus:
  prometheusSpec:
    retention: 7d
    scrapeInterval: 15s
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 1536Mi }
    # Pick up every ServiceMonitor/PrometheusRule, not only ones labelled for this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # CampusPass pods advertise their metrics with prometheus.io/* annotations.
    additionalScrapeConfigs:
      - job_name: campuspass-pods
        scrape_interval: 10s
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [campuspass] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            regex: (.+)
            target_label: __metrics_path__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

grafana:
  # Read-only public dashboards at https://<domain>/grafana for the examiner.
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana"
      serve_from_sub_path: true
    auth.anonymous:
      enabled: true
      org_role: Viewer
    users:
      allow_sign_up: false
  ingress:
    enabled: true
    ingressClassName: traefik
    path: /grafana
    pathType: Prefix
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.monitoring.svc:3100
      access: proxy
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }
